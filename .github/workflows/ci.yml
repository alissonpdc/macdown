name: CI

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'docs/**'
      - 'test/**'
      - 'chore/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar SwiftFormat
        run: brew install swiftformat

      - name: Lint (swiftformat --lint)
        run: swiftformat --swiftversion 5.9 --lint Sources/

  build-and-test:
    name: Build (zero warnings) + Testes
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (falha se houver warnings)
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee build.log
          if grep -q "warning:" build.log; then
            echo "::error::Build gerou warnings — corrija antes de prosseguir"
            exit 1
          fi

      - name: Testes
        run: swift test

  create-pr:
    name: Criar PR para main
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Criar Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          base: main
          title: "${{ github.ref_name }}"
          body: |
            PR auto-gerado pelo CI após lint + build + testes passarem.
          commit-message: "ci: auto-PR after passing CI"
