name: CI

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar SwiftFormat
        run: brew install swiftformat

      - name: Lint (swiftformat --lint)
        run: swiftformat --swiftversion 5.9 --lint Sources/

  test:
    name: Testes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testes
        run: swift test

  build:
    name: Build (zero warnings)
    needs: [lint, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (falha se houver warnings)
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee build.log
          if grep -q "warning:" build.log; then
            echo "::error::Build gerou warnings — corrija antes de prosseguir"
            exit 1
          fi

  create-pr:
    name: Criar PR para main
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Criar Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --head "${{ github.ref_name }}" --base main --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING já existe, nada a fazer."
          else
            gh pr create \
              --base main \
              --title "${{ github.ref_name }}" \
              --body "PR auto-gerado pelo CI após lint + build + testes passarem."
          fi
