<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link id="theme-css" rel="stylesheet" href="themes/github-light.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 40px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  #content { max-width: 860px; margin: 0 auto; }
</style>
<script src="marked.min.js"></script>
<script src="highlight.min.js"></script>
<script>
  marked.setOptions({
    highlight: function(code, lang) {
      const language = hljs.getLanguage(lang) ? lang : 'plaintext';
      return hljs.highlight(code, { language: language }).value;
    },
    langPrefix: 'hljs language-',
    gfm: true,
    breaks: false
  });

  function render(markdown, theme) {
    document.getElementById('theme-css').href = 'themes/github-' + theme + '.css';
    document.getElementById('content').innerHTML = marked.parse(markdown);
    document.querySelectorAll('pre code:not(.hljs)').forEach(function(block) {
      hljs.highlightElement(block);
    });
  }
</script>
</head>
<body>
  <div id="content"></div>
</body>
</html>
